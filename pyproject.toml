[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-selftracker"
version = "0.1.0"
description = "Dockerized Garmin Connect extractor with local SQLite storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.11.0",
    "garminconnect>=0.2.25,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "ruff==0.15.11",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["templates/*.txt"]
