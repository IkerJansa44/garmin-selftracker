repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests -v
        language: system
        always_run: true
        pass_filenames: false
